version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    versioning-strategy: increase
    open-pull-requests-limit: 5
    labels: [dependencies, npm]
    ignore:
      # Litewave qualifies one Playwright driver version (src/profile.ts checks
      # the installed driver against the pin); upgrading it is a maintainer
      # task with a browser re-qualification, not a Dependabot bump.
      - dependency-name: playwright
      # Types follow the supported Node major (engines.node), not the newest.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: mix
    directory: /packages/phoenix
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, hex]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, actions]
