name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  node:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
        node: ["24.21.0", "26"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser

  phoenix:
    name: Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.17.3"
            otp: "27"
          - elixir: "1.20.4"
            otp: "29"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: litewave_phoenix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MIX_ENV: test
      LITEWAVE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/litewave_phoenix_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}
      - uses: actions/cache@v4
        with:
          path: |
            packages/phoenix/deps
            packages/phoenix/_build
          key: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('packages/phoenix/mix.lock') }}
          restore-keys: mix-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-
      - uses: actions/cache@v4
        with:
          path: packages/phoenix/priv/plts
          key: plt-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('packages/phoenix/mix.lock') }}
          restore-keys: plt-${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-
      - run: mix deps.get
        working-directory: packages/phoenix
      - run: mix precommit
        working-directory: packages/phoenix
      - run: mix hex.audit
        working-directory: packages/phoenix
      - run: mix docs --warnings-as-errors
        working-directory: packages/phoenix
        env:
          MIX_ENV: dev
      - run: mix hex.build
        working-directory: packages/phoenix
        env:
          MIX_ENV: dev
      - name: Hex tarball ships the notices and changelog
        working-directory: packages/phoenix
        env:
          MIX_ENV: dev
        run: |
          mix hex.build --unpack -o hex-build
          for f in CHANGELOG.md LICENSE LICENSE-APACHE NOTICE README.md mix.exs .formatter.exs; do
            [ -e "hex-build/$f" ] || { echo "missing $f in Hex tarball"; exit 1; }
          done
          rm -rf hex-build
